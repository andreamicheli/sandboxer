[project]
name = "sandboxer-pilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "groq>=0.31,<1",
  "inspect-ai>=0.3.234,<0.4",
  "inspect-swe>=0.2.60,<0.3",
  "openai>=1.99,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pypdf>=6.0,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
